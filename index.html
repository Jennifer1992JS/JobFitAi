<script>
    // Lucide Icons initialisieren
    lucide.createIcons();

    // Elements
    const form = document.getElementById('jobfit-form');
    const submitBtn = document.getElementById('submit-btn');
    const outputContainer = document.getElementById('output-container');
    const outputText = document.getElementById('output-text');

    const jobInput = document.getElementById('job-description');
    const profileInput = document.getElementById('user-profile');
    const jobCount = document.getElementById('job-count');
    const profileCount = document.getElementById('profile-count');

    // Live-Zeichenzähler
    jobInput.addEventListener('input', () => {
      jobCount.textContent = jobInput.value.length;
    });

    profileInput.addEventListener('input', () => {
      profileCount.textContent = profileInput.value.length;
    });

    // Formular-Submit Handling
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // UI State: Loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i data-lucide="loader-2" class="spin" style="width: 20px; height: 20px;"></i> Verarbeite Daten via n8n...`;
      lucide.createIcons();

      try {
        // Direkter Aufruf der api.php auf deinem IONOS-Server
        const response = await fetch('http://31.70.111.246/api.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            jobDescription: jobInput.value,
            userProfile: profileInput.value
          })
        });

        if (!response.ok) {
          throw new Error('Fehler bei der Übertragung');
        }

        const data = await response.json();

        // Ergebnis aus n8n anzeigen
        outputText.innerText = data.result || 'Kein Ergebnis von n8n zurückerhalten.';
        outputContainer.style.display = 'block';
        outputContainer.scrollIntoView({ behavior: 'smooth' });

      } catch (error) {
        console.error('Fehler:', error);
        alert('Es gab einen Fehler bei der Verbindung zu n8n. Bitte versuche es später noch einmal.');
      } finally {
        // UI State zurücksetzen
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="sparkles" style="width: 20px; height: 20px;"></i> jetzt analysieren & Anschreiben generieren`;
        lucide.createIcons();
      }
    });

    // Ergebnis kopieren
    function copyResult() {
      const text = document.getElementById('output-text').innerText;
      navigator.clipboard.writeText(text);
      alert('Ergebnis in die Zwischenablage kopiert!');
    }
  </script>
